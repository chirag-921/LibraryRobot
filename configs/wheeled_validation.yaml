# Wheeled mobile base validation parameters and acceptance thresholds.
# Every numerical parameter and threshold below is provisional and NEEDS TUNING.

general:
  settle_time_s: 0.10             # seconds for robot to settle on floor; needs tuning
  integrator_timestep_s: 0.002    # seconds per simulation step; needs tuning

motor_direction:
  wheel_speed: 2.0                # rad/s constant open-loop wheel command; needs tuning
  duration_s: 1.0                 # seconds; needs tuning
  min_forward_dist_m: 0.05        # metres minimum forward translation; needs tuning
  min_turn_angle_rad: 0.10        # radians minimum counter-clockwise yaw; needs tuning

straight_drive:
  wheel_speed: 3.0                # rad/s constant forward wheel command; needs tuning
  duration_s: 2.0                 # seconds; needs tuning
  min_forward_dist_m: 0.35        # metres expected forward distance (~0.60m ideal); needs tuning
  max_lateral_drift_m: 0.03       # metres maximum allowed lateral (y) deviation; needs tuning
  max_heading_drift_rad: 0.02     # radians maximum allowed heading deviation; needs tuning

inplace_turn:
  wheel_speed: 2.0                # rad/s differential wheel command; needs tuning
  duration_s: 2.0                 # seconds; needs tuning
  min_turn_angle_rad: 0.80        # radians minimum accumulated yaw (~1.29 rad ideal); needs tuning
  max_position_drift_m: 0.02      # metres maximum allowed translational drift from origin; needs tuning

tip_test:
  payload_mass_kg: 0.50           # kg; baseline book-mass payload; needs tuning
  extended_arm_joints:            # arm pitched forward to shift CoM outwards; needs tuning
    joint1: 0.0
    joint2: 0.50                  # radians pitch forward; needs tuning
    joint3: 0.0
    joint4: -1.00                 # radians elbow; needs tuning
    joint5: 0.0
    joint6: 1.50                  # radians wrist pitch; needs tuning
    joint7: 0.0
  drive_accel_speed: 4.0          # rad/s forward drive command; needs tuning
  drive_duration_s: 1.0           # seconds forward drive; needs tuning
  brake_duration_s: 0.5           # seconds abrupt stop; needs tuning
  turn_speed: 3.0                 # rad/s turn command; needs tuning
  turn_duration_s: 1.0            # seconds turn; needs tuning
  post_turn_brake_duration_s: 0.5 # seconds final brake/settle; needs tuning
  max_pitch_rad: 0.10             # ~5.7 degrees maximum allowed pitch angle; needs tuning
  max_roll_rad: 0.10              # ~5.7 degrees maximum allowed roll angle; needs tuning
  wheel_contact_loss_threshold_m: 0.005 # metres max vertical departure from ground; needs tuning

stress_tip_test:
  payload_mass_kg: 2.00           # kg; upper-bound payload attached at gripper; needs tuning
  extended_pose_left:             # sweep pose left boundary; needs tuning
    joint1: -0.50
    joint2: 0.85
    joint3: 0.0
    joint4: -0.30
    joint5: 0.0
    joint6: 1.05
    joint7: 0.0
  extended_pose_right:            # sweep pose right boundary; needs tuning
    joint1: 0.50
    joint2: 0.85
    joint3: 0.0
    joint4: -0.30
    joint5: 0.0
    joint6: 1.05
    joint7: 0.0
  arm_sweep_freq_hz: 1.0          # Hz sweep frequency of arm joint 1; needs tuning
  max_drive_speed: 8.0            # rad/s configured max wheel speed; needs tuning
  max_turn_speed: 8.0             # rad/s configured max in-place turn wheel speed; needs tuning
  drive_duration_s: 1.0           # seconds max acceleration forward; needs tuning
  brake_duration_s: 0.5           # seconds hard braking; needs tuning
  turn_duration_s: 1.0            # seconds max yaw rate in-place turn; needs tuning
  post_turn_brake_duration_s: 0.5 # seconds final hard brake/settle; needs tuning
  max_pitch_rad: 0.05             # ~2.86 degrees threshold; needs tuning
  max_roll_rad: 0.05              # ~2.86 degrees threshold; needs tuning
  max_wheel_lift_m: 0.002         # 2.0 mm max allowed wheel departure; needs tuning
