# Robot model selection and initial parameters.
# Every numerical base value below is a proposed starting value and NEEDS TUNING.
base_type: wheeled  # Select: wheeled | virtual

simulation:
  timestep: 0.002       # needs tuning
  gravity: [0.0, 0.0, -9.81]  # needs tuning
  integrator: implicitfast
  ground_friction: [1.0, 0.01, 0.001]  # needs tuning
  key_light_position: [0.0, -1.0, 3.0]  # visual parameter; needs tuning
  key_light_direction: [0.0, 0.0, -1.0]

panda_home:
  # Reference configuration copied from the original Menagerie Panda home keyframe.
  arm_joints:
    joint1: 0.0
    joint2: 0.0
    joint3: 0.0
    joint4: -1.57079
    joint5: 0.0
    joint6: 1.57079
    joint7: -0.78530
  finger_positions: [0.04, 0.04]
  gripper_actuator_command: 255.0

panda_tucked:
  # Arm folded close to base during driving to minimize tip risk and footprint
  arm_joints:
    joint1: 0.0
    joint2: -0.785398  # rad; tucked backward; needs tuning
    joint3: 0.0
    joint4: -2.356194  # rad; folded elbow; needs tuning
    joint5: 0.0
    joint6: 1.570796   # rad; wrist level; needs tuning
    joint7: 0.785398   # rad; needs tuning
  finger_positions: [0.0, 0.0]
  gripper_actuator_command: 0.0

base:
  initial_pose_xyyaw: [0.0, 0.0, 0.0]  # needs tuning; metres, metres, radians
  chassis_mass: 40.0  # kg; needs tuning
  chassis_half_size: [0.34, 0.28, 0.10]  # m; needs tuning
  panda_mount_position: [-0.10, 0.0, 0.10]  # m relative to chassis; needs tuning
  panda_gravity_compensation: 0.0  # 0.0=off (default for physics realism); set to 1.0 to re-enable; needs tuning

  wheeled:
    wheel_radius: 0.10       # m; needs tuning
    wheel_separation: 0.62   # m, distance between wheel centres; needs tuning
    wheel_width: 0.06        # m; needs tuning
    wheel_mass: 1.5          # kg per wheel; needs tuning
    wheel_joint_damping: 0.10  # needs tuning
    wheel_joint_armature: 0.01 # needs tuning
    wheel_friction: [1.5, 0.02, 0.001]  # needs tuning
    wheel_speed_limit: 8.0   # rad/s; needs tuning
    wheel_torque_limit: 5.0  # N*m; needs tuning
    wheel_velocity_gain: 10.0  # needs tuning
    max_linear_velocity: 0.60   # m/s; needs tuning
    max_angular_velocity: 0.80  # rad/s; needs tuning
    max_linear_accel: 0.60      # m/s^2; well below motor saturation; needs tuning
    max_angular_accel: 0.60     # rad/s^2; well below motor saturation; needs tuning
    caster_radius: 0.05     # m; needs tuning
    caster_mass: 0.30       # kg per caster; needs tuning
    caster_x_offset: 0.24   # m; needs tuning
    caster_joint_damping: 0.02  # needs tuning
    caster_friction: [0.05, 0.005, 0.0005]  # needs tuning

  virtual:
    x_range: [-4.0, 4.0]       # m; needs tuning
    y_range: [-3.0, 3.0]       # m; needs tuning
    yaw_range: [-6.283185, 6.283185]  # rad; needs tuning
    position_kp: 200.0         # needs tuning
    position_kv: 30.0          # needs tuning
    position_force_limit: 500.0  # N; needs tuning
    yaw_kp: 200.0              # needs tuning
    yaw_kv: 30.0               # needs tuning
    yaw_torque_limit: 200.0    # N*m; needs tuning
    support_radius: 0.05      # m, low-friction support spheres; needs tuning
    support_mass: 0.01        # kg per support sphere; needs tuning
    support_x_offset: 0.24    # m; needs tuning
    support_y_offset: 0.18    # m; needs tuning
    support_friction: [0.05, 0.005, 0.0005]  # needs tuning

validation:
  simulation_steps: 500  # smoke-test steps; needs tuning
  viewer_sync_period_s: 0.02  # seconds; needs tuning
  arm_gravcomp: false  # false => remove gravity compensation for validation tests

diff_drive_controller:
  k_bearing: 2.0        # angular velocity gain towards waypoint bearing; needs tuning
  k_drive: 0.8          # linear velocity gain proportional to distance; needs tuning
  k_heading: 1.8        # angular velocity gain to align final heading; needs tuning
  position_tolerance: 0.02  # metres (2 cm) acceptable radius to waypoint; needs tuning
  heading_tolerance: 0.0349 # radians (~2.0 deg) acceptable heading error; needs tuning
  settle_steps: 50      # steps (0.1 s at dt=0.002) to hold position and heading; needs tuning
  timeout_per_segment_s: 15.0 # seconds before segment is flagged TIMEOUT_FAILED; needs tuning
  arm_motion_velocity_threshold: 0.05  # rad/s passive deflection threshold; needs tuning
  dt: 0.002             # seconds controller simulation timestep; needs tuning
  use_odometry: false   # true => controller uses odometry pose; false => ground truth; needs tuning
