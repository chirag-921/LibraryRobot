[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-robot"
version = "0.1.0"
description = "LLM-guided autonomous mobile librarian robot"
requires-python = ">=3.12,<3.13"

dependencies = [
    "mujoco",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "tqdm",
    "pytest",
    "jsonschema",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]